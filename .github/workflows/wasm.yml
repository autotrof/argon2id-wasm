name: Build WASM

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown


      - run: cargo install wasm-bindgen-cli --version 0.2.123
      - run: cargo test --manifest-path wasm-source/argon2id/Cargo.toml
      - run: cargo build --manifest-path wasm-source/argon2id/Cargo.toml --release --target wasm32-unknown-unknown
      - run: wasm-bindgen wasm-source/argon2id/target/wasm32-unknown-unknown/release/wasm_argon2id.wasm --out-dir src/wasm --target bundler

      - uses: actions/upload-artifact@v4
        with:
          name: argon2id-wasm-cloudflare
          path: src/wasm/

      - name: Commit generated Cloudflare binding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/wasm/
          if git diff --cached --quiet; then
            echo "No generated binding changes"
          else
            git commit -m "Update Cloudflare WASM binding [skip ci]"
            git push
          fi
